[project]
name = "grace-slack"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "grace-shared",
  "fastmcp>=0.4.0",
  "slack-sdk>=3.27",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grace_slack"]
