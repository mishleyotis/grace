[project]
name = "grace-sheets"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "grace-shared",
  "fastmcp>=0.4.0",
  "google-api-python-client>=2.140",
  "google-auth>=2.30",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grace_sheets"]
